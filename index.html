<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Dashboard Trésorerie - Freelance</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body id="app-body">
    <div class="container" id="pdf-content">
        <header class="header-pro">
            <div class="brand">
                <div class="logo-area">
                    <img src="logo-entreprise.png" alt="Logo Entreprise" id="company-logo" style="max-height: 60px; margin-bottom: 10px;" onerror="this.style.display='none'">
                </div>
                <h1 contenteditable="true" id="company-name">Nom de l'Entreprise</h1>
                <p>SIRET : <span contenteditable="true" id="company-siret">000 000 000 00000</span></p>
                <p class="subtitle">Suivi d'activité et rentabilité en temps réel</p>
            </div>
            <div class="toolbar">
                <button onclick="toggleTheme()" class="btn btn-theme">Mode Sombre</button>
                <button onclick="exporterPDF()" class="btn btn-pdf">Exporter PDF</button>
                <button onclick="saveData()" class="btn btn-backup">Sauvegarder (Backup)</button>
                <input type="file" id="importFile" style="display:none" onchange="importData(event)">
                <button onclick="document.getElementById('importFile').click()" class="btn" style="background:#9b59b6">Importer</button>
            </div>
        </header>

        <div class="main-layout">
            <div class="table-section">
                <table>
                    <thead>
                        <tr>
                            <th>Mois</th>
                            <th>CA Brut (€)</th>
                            <th>TVA (20%)</th>
                            <th>Cotisations (21.1%)</th>
                            <th>Frais (€)</th>
                            <th>Bénéfice Net</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                    <tfoot>
                        <tr class="total-row">
                            <td>TOTAL ANNUEL</td>
                            <td id="total-ca">0.00 €</td>
                            <td id="total-tva">0.00 €</td>
                            <td id="total-urssaf">0.00 €</td>
                            <td id="total-frais">0.00 €</td>
                            <td id="total-net">0.00 €</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            <div class="chart-section">
                <canvas id="beneficeChart"></canvas>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
