<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Trésorerie SARL - Kiaelle</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body id="app-body">
    <div class="container">
        <header class="header-pro">
            <div class="brand">
                <img src="logo-kiaelle.png" alt="Logo Kiaelle" style="max-height: 70px;" onerror="this.style.display='none'">
                <h1>Ma Trésorerie SARL</h1>
                <p>Structure : <strong>Kiaelle</strong> | Régime : <strong>TNS</strong></p>
            </div>
            <div class="toolbar">
                <button onclick="toggleTheme()" class="btn btn-theme">Mode Sombre</button>
                <button onclick="exporterPDF()" class="btn btn-pdf">Exporter PDF</button>
                <button onclick="saveData()" class="btn btn-backup">Sauvegarder (Backup)</button>
                <input type="file" id="importFile" style="display:none" onchange="importData(event)">
                <button onclick="document.getElementById('importFile').click()" class="btn" style="background:#9b59b6">Importer</button>
            </div>
        </header>

        <div class="main-layout">
            <div class="table-section">
                <table>
                    <thead>
                        <tr>
                            <th>Mois</th>
                            <th>CA Brut (€)</th>
                            <th>TVA (20%)</th>
                            <th>Cotisations TNS (€)</th>
                            <th>Frais (€)</th>
                            <th>Bénéfice Net</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                    <tfoot>
                        <tr class="total-row">
                            <td>TOTAL ANNUEL</td>
                            <td id="total-ca">0.00 €</td>
                            <td id="total-tva">0.00 €</td>
                            <td id="total-tns">0.00 €</td>
                            <td id="total-frais">0.00 €</td>
                            <td id="total-net">0.00 €</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            <div class="chart-section">
                <canvas id="beneficeChart"></canvas>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
