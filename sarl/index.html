<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Trésorerie SARL - Kiaelle</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body id="app-body">
    <div class="main-layout">
        <div class="table-section">
            <header>
                <h1>Ma Trésorerie SARL</h1>
                <p>Structure : Kiaelle | Régime : TNS</p>
            </header>

            <div class="main-actions">
                <button onclick="exporterPDF()" class="btn btn-pdf">Exporter en PDF</button>
            </div>

            <table id="treso-table">
                <thead>
                    <tr>
                        <th style="width: 10%;">Mois</th>
                        <th style="width: 15%;">CA Brut (€)</th>
                        <th style="width: 12%;">TVA (20%)</th>
                        <th style="width: 18%;">Cotisations TNS (€)</th>
                        <th style="width: 15%;">Frais (€)</th>
                        <th style="width: 15%;">Bénéfice Net</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    </tbody>
                <tfoot>
                    <tr class="total-row">
                        <td>TOTAL ANNUEL</td>
                        <td id="total-ca">0.00 €</td>
                        <td id="total-tva">0.00 €</td>
                        <td id="total-tns">0.00 €</td>
                        <td id="total-frais">0.00 €</td>
                        <td id="total-net">0.00 €</td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="chart-section">
            <canvas id="beneficeChart"></canvas>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
