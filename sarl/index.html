<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Trésorerie SARL - Kiaelle</title>
    <!-- On s'assure que le lien vers le CSS est correct -->
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body id="app-body">
    <div class="container"> <!-- Élément crucial pour le design -->
        <header class="header-pro">
            <div class="brand">
                <img src="logo-kiaelle.png" alt="Logo Kiaelle" style="height: 60px; margin-bottom: 10px;">
                <h1>Ma Trésorerie SARL</h1>
                <p>Structure : Kiaelle | Régime : TNS</p>
            </div>
            <div class="main-actions">
                <button onclick="exporterPDF()" class="btn btn-pdf">Exporter en PDF</button>
            </div>
        </header>

        <div class="main-layout">
            <div class="table-section">
                <table id="treso-table">
                    <thead>
                        <tr>
                            <th>Mois</th>
                            <th>CA Brut (€)</th>
                            <th>TVA (20%)</th>
                            <th>Cotisations TNS (€)</th>
                            <th>Frais (€)</th>
                            <th>Bénéfice Net</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Généré par JS -->
                    </tbody>
                    <tfoot>
                        <tr class="total-row">
                            <td>TOTAL</td>
                            <td id="total-ca">0.00 €</td>
                            <td id="total-tva">0.00 €</td>
                            <td id="total-tns">0.00 €</td>
                            <td id="total-frais">0.00 €</td>
                            <td id="total-net">0.00 €</td>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <div class="chart-section">
                <canvas id="beneficeChart"></canvas>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
